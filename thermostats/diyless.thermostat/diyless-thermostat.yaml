# Thermostat
# -- DIYLESS Thermostat 3
# -- https://diyless.com/product/opentherm-thermostat3

# ==== BASIC CONFIG ====
substitutions:
  device_name: diyless-thermostat
  friendly_name: Thermostat
  device_description: DIYLESS Thermostat 3 (esp32 with OpenTherm and 4.0-inch display)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  logs:
    wifi: WARN
    api: WARN

# ==== CONNECTIVITY ====
# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret network_domain

  min_auth_mode: WPA3

# Enable Home Assistant API
api:
  encryption:
    key: !secret diyless-thermostat__encryption_key

# Enable Over-The-Air (OTA) platform to remotely install modified/updated firmware
ota:
  - platform: esphome
    encryption:

# ===================== #
#     SENSOR CONFIG     #
# ===================== #

# i2C pin configuration
i2c:
  sda: GPIO17
  scl: GPIO18
  scan: true

# AHT20 sensor configuration for temperature and humidity
sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: Temperature
      id: builtin_temp
      icon: "mdi:thermometer"
    humidity:
      name: Humidity
      id: builtin_hum
      icon: "mdi:water-percent"
    update_interval: 60s
